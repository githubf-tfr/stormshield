name: qualite

on:
  push:
  pull_request:

jobs:
  qualite:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Le plancher déclaré par requires-python et la version de développement.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # `tests/test_fenetre.py` construit la vraie fenêtre : il lui faut `tkinter` et un
      # affichage, et un runner n'a ni l'un ni l'autre. `python3-tk` apporte la
      # bibliothèque Tcl/Tk dont le `_tkinter` de `setup-python` a besoin pour se
      # charger, `xvfb` l'affichage. Sans eux, ces tests se sauteraient — verts, sans
      # rien prouver, ce que le dernier pas refuse.
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y python3-tk xvfb
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: mypy
      - name: Suite complète sous affichage virtuel
        # `xvfb-run -a` choisit lui-même un numéro d'affichage libre. Le marqueur
        # firewall est déjà exclu par addopts ; répété ici pour que le workflow dise
        # lui-même ce qu'il ne prouve pas.
        #
        # Aucun test ne doit être sauté sur ce runner. Un saut y voudrait dire que
        # l'affichage manque : les tests d'interface passeraient au vert sans avoir rien
        # prouvé, et c'est exactement ce que ce workflow doit rendre impossible.
        run: |
          resultat=$(xvfb-run -a pytest -m "not firewall" -q --no-header)
          echo "$resultat"
          case "$resultat" in
            *skipped*)
              echo "::error::des tests ont été sautés : xvfb ou tkinter manque sur ce runner"
              exit 1
              ;;
          esac
